<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Squad Up</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  background: #f5f5f0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  color: #1a1a1a;
}

/* Header */
.header {
  background: #fff;
  padding: 20px 20px 16px;
  flex-shrink: 0;
}
.header h1 { font-size: 22px; font-weight: 700; margin-bottom: 2px; }
.header .subtitle {
  font-size: 13px; color: #888; line-height: 1.4;
}

/* Group card */
.group-card {
  background: #fff;
  border: 1px solid #e8e8e4;
  border-radius: 16px;
  padding: 14px 16px;
  margin: 0 20px 8px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.group-avatars { display: flex; flex-shrink: 0; }
.group-avatars .av {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 600; color: #fff;
  border: 2px solid #fff; margin-left: -10px;
}
.group-avatars .av:first-child { margin-left: 0; }
.group-info { flex: 1; }
.group-info .name { font-size: 15px; font-weight: 600; }
.group-info .members { font-size: 12px; color: #888; margin-top: 1px; }

/* Chat area */
.chat {
  flex: 1; overflow-y: auto;
  padding: 8px 20px 12px;
  display: flex; flex-direction: column; gap: 2px;
  -webkit-overflow-scrolling: touch;
}

/* System divider */
.sys-divider {
  text-align: center; padding: 16px 0 12px;
  font-size: 10px; font-weight: 600;
  letter-spacing: 1px; color: #bbb;
}

/* System message */
.msg-system {
  text-align: center; padding: 6px 0;
  font-size: 13px; color: #999;
  animation: fadeIn 0.2s ease;
}

/* Bot message row */
.msg-bot {
  display: flex; gap: 10px; align-items: flex-start;
  margin-top: 10px; animation: fadeIn 0.25s ease;
}
.msg-bot .bot-av {
  width: 34px; height: 34px; border-radius: 50%;
  background: #f0efe8; display: flex; align-items: center;
  justify-content: center; font-size: 18px; flex-shrink: 0;
}
.msg-bot .bot-content { max-width: 78%; }
.msg-bot .bot-name {
  font-size: 12px; font-weight: 500; color: #888;
  margin-bottom: 3px; padding-left: 2px;
}
.msg-bot .bot-bubble {
  background: #f0efe8; border: 1px solid #e0dfd8;
  border-radius: 18px; border-top-left-radius: 4px;
  padding: 10px 14px; font-size: 14px; line-height: 1.5;
  white-space: pre-wrap; word-wrap: break-word;
}

/* User message */
.msg-user {
  display: flex; justify-content: flex-end;
  margin-top: 10px; animation: fadeIn 0.2s ease;
}
.msg-user .bubble {
  background: #1a1a1a; color: #fff;
  border-radius: 18px; border-bottom-right-radius: 4px;
  padding: 10px 14px; font-size: 14px; line-height: 1.45;
  max-width: 70%; word-wrap: break-word;
}

/* Vote chips row */
.votes-row {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin: 8px 0 4px; animation: fadeIn 0.3s ease;
}
.vote-chip {
  display: flex; align-items: center; gap: 6px;
  background: #fff; border: 1px solid #e0dfd8;
  border-radius: 20px; padding: 6px 12px 6px 6px;
  font-size: 12px; line-height: 1.3;
}
.vote-chip .v-av {
  width: 22px; height: 22px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 600; color: #fff; flex-shrink: 0;
}
.vote-chip .v-check { color: #4caf50; font-weight: 700; margin-right: -2px; }
.vote-chip .v-text { color: #555; }

/* Proposal card */
.proposal-card {
  background: #fff; border: 1.5px solid #e0dfd8;
  border-radius: 16px; padding: 0; margin: 10px 0;
  overflow: hidden; animation: fadeIn 0.3s ease;
  max-width: 92%;
}
.pc-label {
  display: inline-block;
  background: #e8a44a; color: #fff;
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.8px;
  padding: 3px 10px; border-radius: 0 0 8px 0;
}
.pc-inner { padding: 10px 16px 14px; }
.pc-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
.pc-body {
  font-size: 13px; line-height: 1.55; color: #444;
  white-space: pre-wrap; margin-bottom: 8px;
}
.pc-explanation {
  font-size: 12px; color: #999; line-height: 1.4;
  margin-bottom: 10px; font-style: italic;
}
.pc-participants {
  display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px;
}
.pc-participant {
  display: flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 500;
  background: #f5f5f0; border-radius: 12px; padding: 4px 10px 4px 4px;
}
.pc-participant .pp-av {
  width: 18px; height: 18px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 600; color: #fff;
}
.pc-participant.you { border: 1.5px solid #1a1a1a; }
.pc-actions {
  display: flex; gap: 8px; flex-wrap: wrap;
}
.pc-btn {
  padding: 8px 16px; border-radius: 20px;
  font-size: 13px; font-weight: 500;
  cursor: pointer; border: none; font-family: inherit;
  transition: all 0.15s;
}
.pc-btn.primary {
  background: #1a1a1a; color: #fff;
}
.pc-btn.primary:hover { background: #333; }
.pc-btn.secondary {
  background: #fff; color: #444; border: 1px solid #ddd;
}
.pc-btn.secondary:hover { background: #f5f5f0; }
.pc-btn.ghost {
  background: transparent; color: #888;
  padding: 8px 12px;
}
.pc-btn.ghost:hover { color: #444; }

/* Approval row */
.approval-row {
  display: flex; align-items: center; gap: 8px;
  margin: 6px 0; animation: fadeIn 0.25s ease;
}
.approval-row .a-av {
  width: 24px; height: 24px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600; color: #fff; flex-shrink: 0;
}
.approval-row .a-text {
  font-size: 13px; color: #666;
}
.approval-row .a-check { color: #4caf50; font-size: 15px; }

/* Signed / failed banners */
.banner {
  border-radius: 16px; padding: 14px 18px; margin: 10px 0;
  font-size: 14px; font-weight: 500;
  text-align: center; animation: fadeIn 0.3s ease;
  max-width: 92%;
}
.banner.signed {
  background: #e8f5e9; border: 1.5px solid #66bb6a; color: #2e7d32;
}
.banner.failed {
  background: #fbe9e7; border: 1.5px solid #ef5350; color: #c62828;
}

/* Veto prompt */
.veto-prompt {
  background: #fff8e1; border: 1.5px solid #e8a44a;
  border-radius: 16px; padding: 14px 18px; margin: 10px 0;
  font-size: 14px; color: #7a5a1a; text-align: center;
  animation: fadeIn 0.3s ease; max-width: 92%;
}

/* Command chips */
.chips {
  display: flex; gap: 8px; padding: 8px 20px;
  overflow-x: auto; flex-shrink: 0;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  background: #fff; border: 1px solid #e0dfd8;
  border-radius: 20px; padding: 8px 16px;
  font-size: 13px; cursor: pointer; white-space: nowrap;
  color: #444; transition: background 0.15s; flex-shrink: 0;
}
.chip:hover { background: #f0efe8; }

/* Input bar */
.inputbar {
  padding: 8px 20px 12px; display: flex; gap: 8px; flex-shrink: 0;
}
.inputbar input {
  flex: 1; background: #fff; border: 1px solid #e0dfd8;
  border-radius: 22px; padding: 11px 18px;
  font-size: 15px; outline: none; font-family: inherit; color: #1a1a1a;
}
.inputbar input::placeholder { color: #bbb; }
.inputbar input:focus { border-color: #aaa; }
.inputbar button {
  background: #1a1a1a; color: #fff; border: none;
  border-radius: 50%; width: 38px; height: 38px;
  font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.inputbar button:disabled { opacity: 0.3; cursor: default; }

/* Typing */
.typing-row {
  display: flex; gap: 10px; align-items: flex-start; margin-top: 10px;
}
.typing-row .bot-av {
  width: 34px; height: 34px; border-radius: 50%;
  background: #f0efe8; display: flex; align-items: center;
  justify-content: center; font-size: 18px; flex-shrink: 0;
}
.typing-row .dots {
  background: #f0efe8; border-radius: 18px; padding: 12px 16px;
  margin-top: 4px;
}
.dot {
  display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  background: #aaa; margin: 0 2px; animation: bounce 1.4s infinite;
}
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); }
  30% { transform: translateY(-6px); }
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div class="header">
  <h1>Squad Up</h1>
  <div class="subtitle">One bot in the group chat. Everyone sees their own agent negotiate on their behalf.</div>
</div>

<div class="group-card">
  <div class="group-avatars">
    <div class="av" style="background:#e07c5a">M</div>
    <div class="av" style="background:#5aa8e0">J</div>
    <div class="av" style="background:#7bc47f">L</div>
  </div>
  <div class="group-info">
    <div class="name">Lantana 204</div>
    <div class="members">Maya Chen, Jordan Rivera, Leo Nguyen</div>
  </div>
</div>

<div class="chat" id="chat">
  <div class="sys-divider">SQUAD UP JOINED &middot; EVERYONE SEES THEIR OWN AGENT</div>
</div>

<div class="chips" id="chips">
  <span class="chip" onclick="send('@squad class CSE310')">@squad class CSE310</span>
  <span class="chip" onclick="send('@squad study CSE310')">@squad study CSE310</span>
  <span class="chip" onclick="send('@squad plans')">@squad plans</span>
  <span class="chip" onclick="send('@squad chores')">@squad chores</span>
</div>

<div class="inputbar">
  <input id="input" type="text" placeholder="Message Lantana 204" autocomplete="off">
  <button id="sendBtn" onclick="sendFromInput()">&#9650;</button>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const chipsEl = document.getElementById('chips');

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function scroll() { chat.scrollTop = chat.scrollHeight; }

function addUserBubble(text) {
  const div = document.createElement('div');
  div.className = 'msg-user';
  div.innerHTML = `<div class="bubble">${esc(text)}</div>`;
  chat.appendChild(div);
  scroll();
}

function renderMessage(msg) {
  switch (msg.type) {

  case 'system': {
    const div = document.createElement('div');
    div.className = 'msg-system';
    div.textContent = msg.text;
    chat.appendChild(div);
    break;
  }

  case 'bot': {
    const div = document.createElement('div');
    div.className = 'msg-bot';
    div.innerHTML = `
      <div class="bot-av">&#127875;</div>
      <div class="bot-content">
        <div class="bot-name">Squad Up</div>
        <div class="bot-bubble">${esc(msg.text)}</div>
      </div>`;
    chat.appendChild(div);
    break;
  }

  case 'votes': {
    const row = document.createElement('div');
    row.className = 'votes-row';
    for (const v of msg.votes) {
      const chip = document.createElement('div');
      chip.className = 'vote-chip';
      chip.innerHTML = `
        <div class="v-av" style="background:${v.color}">${v.initial}</div>
        <span class="v-check">&#10003;</span>
        <span class="v-text">${esc(v.text)}</span>`;
      row.appendChild(chip);
    }
    chat.appendChild(row);
    break;
  }

  case 'proposal_card': {
    const card = document.createElement('div');
    card.className = 'proposal-card';

    let participantsHtml = '';
    for (const p of (msg.participants || [])) {
      participantsHtml += `
        <div class="pc-participant">
          <div class="pp-av" style="background:${p.color}">${p.initial}</div>
          ${esc(p.name)}
        </div>`;
    }
    // Add "You" chip
    participantsHtml = `<div class="pc-participant you"><div class="pp-av" style="background:#1a1a1a">Y</div>You</div>` + participantsHtml;

    card.innerHTML = `
      <div class="pc-label">${esc(msg.label)}</div>
      <div class="pc-inner">
        <div class="pc-title">${esc(msg.title)}</div>
        <div class="pc-body">${esc(msg.body)}</div>
        <div class="pc-explanation">${esc(msg.explanation)}</div>
        <div class="pc-participants">${participantsHtml}</div>
        <div class="pc-actions">
          <button class="pc-btn primary" onclick="send('approve')">Confirm</button>
          <button class="pc-btn secondary" onclick="send('veto')">Another option</button>
          <button class="pc-btn ghost" onclick="send('why')">Why this plan?</button>
        </div>
      </div>`;
    chat.appendChild(card);
    break;
  }

  case 'approval': {
    const div = document.createElement('div');
    div.className = 'approval-row';
    div.innerHTML = `
      <div class="a-av" style="background:${msg.color}">${msg.initial}</div>
      <span class="a-check">&#9989;</span>
      <span class="a-text">${esc(msg.name)} approved</span>`;
    chat.appendChild(div);
    break;
  }

  case 'signed': {
    const div = document.createElement('div');
    div.className = 'banner signed';
    div.textContent = msg.text;
    chat.appendChild(div);
    break;
  }

  case 'failed': {
    const div = document.createElement('div');
    div.className = 'banner failed';
    div.textContent = msg.text;
    chat.appendChild(div);
    break;
  }

  case 'veto_prompt': {
    const div = document.createElement('div');
    div.className = 'veto-prompt';
    div.textContent = msg.text;
    chat.appendChild(div);
    break;
  }

  default: {
    // Legacy fallback
    const div = document.createElement('div');
    div.className = 'msg-system';
    div.textContent = msg.text || JSON.stringify(msg);
    chat.appendChild(div);
  }
  }
  scroll();
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'typing-row';
  div.id = 'typing';
  div.innerHTML = `
    <div class="bot-av">&#127875;</div>
    <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
  chat.appendChild(div);
  scroll();
}

function hideTyping() {
  const el = document.getElementById('typing');
  if (el) el.remove();
}

async function send(text) {
  if (!text.trim()) return;
  if (chipsEl) chipsEl.style.display = 'none';
  addUserBubble(text);
  input.value = '';
  sendBtn.disabled = true;
  showTyping();
  try {
    const res = await fetch('/api/message', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text}),
    });
    const data = await res.json();
    hideTyping();
    for (const msg of (data.messages || [])) renderMessage(msg);
  } catch (e) {
    hideTyping();
    renderMessage({type: 'system', text: 'Error: ' + e.message});
  }
  sendBtn.disabled = false;
  input.focus();
}

function sendFromInput() { send(input.value); }

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !sendBtn.disabled) sendFromInput();
});
input.focus();
</script>
</body>
</html>
